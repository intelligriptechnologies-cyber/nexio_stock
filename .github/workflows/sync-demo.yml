name: Sync demo branch

on:
  push:
    branches: [improved_ui]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fast-forward demo branch
        env:
          DEPLOY_KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin improved_ui_demo
          git checkout improved_ui_demo
          git merge --ff-only origin/improved_ui
          git push origin improved_ui_demo
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/barstock_deploy
          chmod 600 ~/.ssh/barstock_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/barstock_deploy "$USER@$HOST" <<'REMOTE'
            set -euo pipefail
            cd /opt/barstock
            git pull --ff-only origin improved_ui
            bash scripts/deploy-remote.sh staging
          REMOTE
